databases:
  - name: trip-track-db
    plan: free
    databaseName: trip_track
    user: trip_track

services:
  - type: web
    name: trip-track
    runtime: ruby
    plan: free
    buildCommand: bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trip-track-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: NODE_VERSION
        value: 22.11.0
      # Set in the Render dashboard (free key from https://api-v3.mbta.com/);
      # the app also works without one at MBTA's shared rate limit.
      - key: MBTA_KEY
        sync: false
