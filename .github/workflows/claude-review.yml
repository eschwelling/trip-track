name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip when no API key is configured
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret is not set — skipping Claude review. Add it under Settings > Secrets and variables > Actions to enable automated reviews."

      - name: Checkout repository
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            Review this pull request and post your feedback as a PR comment,
            using inline comments for findings tied to specific lines.

            Focus on:
            - Correctness bugs, edge cases, and error handling
            - Security issues (this app proxies the MBTA API server-side and
              uses Devise for authentication — watch for key leakage, unsafe
              params, and injection)
            - React 18 pitfalls: reading this.state right after setState
              (automatic batching), missing effect cleanup, stale closures
            - Rails conventions, N+1 queries, and strong-parameter gaps

            Skip pure style nitpicks. Be concise and actionable; if the diff
            looks good, say so briefly rather than inventing findings.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
